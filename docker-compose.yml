services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  db-init:
    build: ./db-init
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # 1) MCP server (FastMCP + MySQL)
  order-mcp:
    build: ./mcp/services/order-mcp
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      MCP_API_KEY: ${MCP_API_KEY}
    restart: unless-stopped

  # 2) Backend API (FastAPI + LangChain agent calling the MCP server)
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      ORDER_MCP_URL: ${ORDER_MCP_URL}
      MCP_API_KEY: ${MCP_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD}
    depends_on:
      - order-mcp
    restart: unless-stopped

  # 3) Frontend (React served by nginx, proxies /api to backend)
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
